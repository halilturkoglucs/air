apiVersion: air.dev/check/v0.1
kind: Check
metadata: { name: document-create-evaluation }
spec:
  capability: { id: documents.create }
  observations: [http, database, messages, outbound, ordering, failures, retryability]
  scenarios:
    - id: creates-document
      request:
        kind: command
        input: { operation: create, title: Quarterly report, documentId: 11111111-1111-4111-8111-111111111111, timestamp: "2026-10-21T10:00:00.000Z", vendorStatus: 200, idempotencyKey: create-1 }
    - id: maps-vendor-failure
      request:
        kind: command
        input: { operation: create, title: Rejected report, documentId: 22222222-2222-4222-8222-222222222222, timestamp: "2026-10-21T10:01:00.000Z", vendorStatus: 503, idempotencyKey: create-2 }
    - id: replays-idempotently
      request:
        kind: command
        input: { operation: create, title: Existing report, documentId: 33333333-3333-4333-8333-333333333333, timestamp: "2026-10-21T10:02:00.000Z", vendorStatus: 200, idempotencyKey: create-3, replay: true }
