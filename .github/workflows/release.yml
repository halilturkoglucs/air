name: AIR release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release gate
        run: pnpm release:check
      - name: Create checksummed source artifact
        run: pnpm release:artifacts artifacts/release
      - name: Publish npm package with provenance
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/cli
        run: |
          npm install --global npm@11.11.0
          npm publish --access public
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes --title "AIR $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: air-${{ github.ref_name }}
          path: artifacts/release
          if-no-files-found: error
