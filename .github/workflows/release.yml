name: AIR release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release gate
        run: pnpm release:check
      - name: Create checksummed source artifact
        run: pnpm release:artifacts artifacts/release
      - name: Install npm publishing client
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install --global npm@11.11.0
      - name: Check npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: npm-registry
        working-directory: packages/cli
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package with provenance
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: |
          npm publish --access public
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes --title "AIR $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: air-${{ github.ref_name }}
          path: artifacts/release
          if-no-files-found: error
