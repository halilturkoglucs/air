name: AIR release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  clean-install:
    name: Clean npm install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install and build distribution
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mvn -q -DskipTests package -f packages/discovery/spring-analyzer/pom.xml
      - name: Pack CLI with the pinned analyzer
        run: |
          mkdir -p "${RUNNER_TEMP}/air-package"
          npm pack --cache "${RUNNER_TEMP}/npm-cache" --workspace=false ./packages/cli --pack-destination "${RUNNER_TEMP}/air-package"
          test -f packages/discovery/spring-analyzer/target/air-spring-analyzer.jar
      - name: Verify a clean installed discovery report
        run: |
          mkdir -p "${RUNNER_TEMP}/air-smoke"
          cd "${RUNNER_TEMP}/air-smoke"
          npm init -y
          npm install "${RUNNER_TEMP}"/air-package/halilturkoglucs-air-*.tgz
          test -f node_modules/@halilturkoglucs/air/analyzers/air-spring-analyzer.jar
          expected_version="$(node --print "require('${GITHUB_WORKSPACE}/packages/cli/package.json').version")"
          test "$(node_modules/.bin/air --version)" = "$expected_version"
          node_modules/.bin/air discover spring "${GITHUB_WORKSPACE}/packages/discovery/spring-analyzer/src/test/resources/fixture" --output discovery --analyzer openrewrite
          node_modules/.bin/air discovery report discovery --output report
          test -s report/report.json
          test -s report/report.html

  package:
    needs: clean-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build pinned OpenRewrite analyzer
        run: mvn -q -DskipTests package -f packages/discovery/spring-analyzer/pom.xml
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          root_version="$(node --print "require('./package.json').version")"
          cli_version="$(node --print "require('./packages/cli/package.json').version")"
          sdk_version="$(node --print "require('./packages/plugin-sdk/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$root_version" = "$cli_version"
          test "$root_version" = "$sdk_version"
          test "$root_version" = "$tag_version"
      - name: Release gate
        run: pnpm release:check
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --cache "${RUNNER_TEMP}/npm-cache" --workspace=false ./packages/plugin-sdk
          npm pack --dry-run --cache "${RUNNER_TEMP}/npm-cache" --workspace=false ./packages/cli
      - name: Create checksummed source artifact
        run: pnpm release:artifacts artifacts/release
      - name: Install npm publishing client
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install --global npm@11.21.0
      - name: Check plugin SDK npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: sdk-npm-registry
        working-directory: packages/plugin-sdk
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish plugin SDK with provenance
        if: startsWith(github.ref, 'refs/tags/v') && steps.sdk-npm-registry.outputs.exists != 'true'
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance
      - name: Check CLI npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: cli-npm-registry
        working-directory: packages/cli
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package with provenance
        if: startsWith(github.ref, 'refs/tags/v') && steps.cli-npm-registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: |
          npm publish --access public --provenance
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes --title "AIR $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: air-${{ github.ref_name }}
          path: artifacts/release
          if-no-files-found: error
