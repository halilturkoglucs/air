name: AIR release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          root_version="$(node --print "require('./package.json').version")"
          cli_version="$(node --print "require('./packages/cli/package.json').version")"
          sdk_version="$(node --print "require('./packages/plugin-sdk/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$root_version" = "$cli_version"
          test "$root_version" = "$sdk_version"
          test "$root_version" = "$tag_version"
      - name: Release gate
        run: pnpm release:check
      - name: Verify npm package contents
        run: |
          npm pack --dry-run --cache "${RUNNER_TEMP}/npm-cache" --workspace=false ./packages/plugin-sdk
          npm pack --dry-run --cache "${RUNNER_TEMP}/npm-cache" --workspace=false ./packages/cli
      - name: Create checksummed source artifact
        run: pnpm release:artifacts artifacts/release
      - name: Install npm publishing client
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm install --global npm@11.21.0
      - name: Check plugin SDK npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: sdk-npm-registry
        working-directory: packages/plugin-sdk
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish plugin SDK with provenance
        if: startsWith(github.ref, 'refs/tags/v') && steps.sdk-npm-registry.outputs.exists != 'true'
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance
      - name: Check CLI npm registry
        if: startsWith(github.ref, 'refs/tags/v')
        id: cli-npm-registry
        working-directory: packages/cli
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package with provenance
        if: startsWith(github.ref, 'refs/tags/v') && steps.cli-npm-registry.outputs.exists != 'true'
        working-directory: packages/cli
        run: |
          npm publish --access public --provenance
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes --title "AIR $GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: air-${{ github.ref_name }}
          path: artifacts/release
          if-no-files-found: error
