{
  "apiVersion": "air.dev/target-capabilities/v0.1",
  "target": {
    "id": "nextjs",
    "displayName": "Next.js",
    "version": "0.10.0"
  },
  "capabilities": {
    "http.crud": {
      "support": "supported",
      "notes": "Mapped to App Router route handlers using Node.js runtime.",
      "constraints": [
        {
          "kind": "air-version",
          "minimum": "air.dev/v0.1",
          "maximum": "air.dev/v0.9"
        }
      ]
    },
    "http.collections": {
      "support": "supported"
    },
    "domain.commands": {
      "support": "conditional",
      "conditions": [
        "AIR v0.7 create/update effects, named atomic updates, guards, ownership authorization, invariant expressions, state preconditions, idempotency replay, and declared transaction isolation are supported."
      ],
      "constraints": [
        {
          "kind": "air-version",
          "minimum": "air.dev/v0.3",
          "maximum": "air.dev/v0.9"
        },
        {
          "kind": "primary-effect-in",
          "values": [
            "create",
            "update",
            "delete"
          ]
        }
      ],
      "notes": "Commands lower to explicit App Router handlers and transactional domain functions with conflict errors."
    },
    "authorization.ownership": {
      "support": "conditional",
      "conditions": [
        "Command authorization supports input-to-principal and persisted-record-to-principal equality rules.",
        "The generated Next.js boundary verifies HS256 bearer JWTs using AIR_AUTH_SECRET and same-named principal claims."
      ],
      "notes": "AIR remains identity-provider neutral and verifies same-named principal claims at the generated boundary."
    },
    "authorization.roles-scopes": {
      "support": "supported"
    },
    "domain.invariants": {
      "support": "conditional",
      "conditions": [
        "Typed scalar comparisons and nested all, any, and not expressions are supported.",
        "Record operands currently require a single-entity update effect; ordered comparisons require non-null numbers."
      ],
      "notes": "Invariant failures map to declared domain errors and run inside the command transaction."
    },
    "domain.multi_effect": {
      "support": "conditional",
      "conditions": [
        "Named effects are update effects followed by one primary create effect.",
        "All records are selected with row locks and all mutations run in one PostgreSQL transaction."
      ]
    },
    "domain.idempotency": {
      "support": "conditional",
      "conditions": [
        "Scoped replay uses a unique output-entity field plus one authenticated principal field.",
        "Serialization, deadlock, and idempotency races support one to ten declared attempts."
      ]
    },
    "domain.delete": {
      "support": "supported"
    },
    "persistence.relational": {
      "support": "conditional",
      "conditions": [
        "PostgreSQL is the only persistence provider in the current target."
      ],
      "constraints": [
        {
          "kind": "option-in",
          "option": "database",
          "values": [
            "postgres"
          ]
        }
      ]
    },
    "messaging.publish": {
      "support": "supported",
      "notes": "Transactional PostgreSQL outbox with provider-neutral envelopes."
    },
    "messaging.consume": {
      "support": "supported",
      "notes": "Durable inbox deduplication, bounded retry, and dead letters."
    },
    "messaging.tasks": {
      "support": "supported",
      "notes": "Point-to-point task delivery is distinct from event fan-out."
    },
    "messaging.ordering": {
      "support": "supported",
      "notes": "Ordering keys are propagated to provider partitions or queues."
    },
    "background.workers": {
      "support": "supported"
    },
    "background.schedules": {
      "support": "supported"
    },
    "orchestration.sagas": {
      "support": "supported",
      "notes": "Saga state and timers persist in PostgreSQL."
    },
    "cache.derived": {
      "support": "supported",
      "notes": "Derived cache reads fall back to their canonical source."
    },
    "realtime.websocket": {
      "support": "supported",
      "notes": "Authenticated request/reply, subscriptions, cursors, and bounded backpressure."
    },
    "realtime.sse": {
      "support": "supported"
    },
    "observability.opentelemetry": {
      "support": "supported"
    },
    "ui.web": {
      "support": "supported",
      "notes": "A basic generated CRUD console is emitted; custom AIR UI remains future work."
    },
    "background.long-running": {
      "support": "supported",
      "notes": "Generated worker and orchestrator entrypoints run as separate components."
    },
    "deployment.vercel": {
      "support": "supported",
      "notes": "Generated applications use the default Node.js runtime and external PostgreSQL."
    }
  }
}
