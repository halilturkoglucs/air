apiVersion: air.dev/verification/v0.1
kind: VerificationSuite
scenarios:
  - id: placeOrderRequiresAuthentication
    command: placeOrder
    given:
      input:
        customerId: 11111111-1111-4111-8111-111111111111
        total: 25
      state:
        Customer:
          - id: 11111111-1111-4111-8111-111111111111
            email: customer@example.com
            createdAt: 2025-01-01T00:00:00.000Z
    expect:
      error: UNAUTHENTICATED

  - id: placeOrderRejectsAnotherCustomer
    command: placeOrder
    given:
      input:
        customerId: 11111111-1111-4111-8111-111111111111
        total: 25
      principal:
        customerId: 22222222-2222-4222-8222-222222222222
        maximumOrderTotal: 100
    expect:
      error: FORBIDDEN

  - id: placeOrderEnforcesApprovedLimit
    command: placeOrder
    given:
      input:
        customerId: 11111111-1111-4111-8111-111111111111
        total: 150
      principal:
        customerId: 11111111-1111-4111-8111-111111111111
        maximumOrderTotal: 100
    expect:
      error: ORDER_LIMIT_EXCEEDED

  - id: placeOrderCreatesPendingOrder
    command: placeOrder
    given:
      input:
        customerId: 11111111-1111-4111-8111-111111111111
        total: 25
      principal:
        customerId: 11111111-1111-4111-8111-111111111111
        maximumOrderTotal: 100
      state:
        Customer:
          - id: 11111111-1111-4111-8111-111111111111
            email: customer@example.com
            createdAt: 2025-01-01T00:00:00.000Z
    expect:
      output:
        id: 00000000-0000-4000-8000-000000000001
        customerId: 11111111-1111-4111-8111-111111111111
        status: pending
        total: 25
        version: 0
        createdAt: 2026-01-01T00:00:00.000Z
      state:
        Customer:
          - id: 11111111-1111-4111-8111-111111111111
            email: customer@example.com
            createdAt: 2025-01-01T00:00:00.000Z
        Order:
          - id: 00000000-0000-4000-8000-000000000001
            customerId: 11111111-1111-4111-8111-111111111111
            status: pending
            total: 25
            version: 0
            createdAt: 2026-01-01T00:00:00.000Z

  - id: markOrderPaidTransitionsOwnedOrder
    command: markOrderPaid
    given:
      input:
        orderId: 33333333-3333-4333-8333-333333333333
        expectedVersion: 0
      principal:
        customerId: 11111111-1111-4111-8111-111111111111
        maximumOrderTotal: 100
      state:
        Order:
          - id: 33333333-3333-4333-8333-333333333333
            customerId: 11111111-1111-4111-8111-111111111111
            status: pending
            total: 25
            version: 0
            createdAt: 2025-01-01T00:00:00.000Z
    expect:
      output:
        id: 33333333-3333-4333-8333-333333333333
        customerId: 11111111-1111-4111-8111-111111111111
        status: paid
        total: 25
        version: 1
        createdAt: 2025-01-01T00:00:00.000Z
      state:
        Order:
          - id: 33333333-3333-4333-8333-333333333333
            customerId: 11111111-1111-4111-8111-111111111111
            status: paid
            total: 25
            version: 1
            createdAt: 2025-01-01T00:00:00.000Z
