apiVersion: air.dev/verification/v0.1
kind: VerificationSuite
scenarios:
  - id: administratorDeletesDraft
    command: deleteDocument
    given:
      principal:
        operatorId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        role: admin
        scope: documents:write
      input:
        documentId: 11111111-1111-4111-8111-111111111111
        expectedStatus: draft
      state:
        Document:
          - id: 11111111-1111-4111-8111-111111111111
            ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            title: Architecture Notes
            status: draft
    expect:
      output:
        id: 11111111-1111-4111-8111-111111111111
        ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        title: Architecture Notes
        status: draft
      state:
        Document: []
  - id: editorCannotDelete
    command: deleteDocument
    given:
      principal:
        operatorId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        role: editor
        scope: documents:write
      input:
        documentId: 11111111-1111-4111-8111-111111111111
        expectedStatus: draft
      state:
        Document:
          - id: 11111111-1111-4111-8111-111111111111
            ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            title: Architecture Notes
            status: draft
    expect:
      error: FORBIDDEN
      state:
        Document:
          - id: 11111111-1111-4111-8111-111111111111
            ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            title: Architecture Notes
            status: draft
  - id: deleteRejectsStaleStatus
    command: deleteDocument
    given:
      principal:
        operatorId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
        role: admin
        scope: documents:write
      input:
        documentId: 11111111-1111-4111-8111-111111111111
        expectedStatus: draft
      state:
        Document:
          - id: 11111111-1111-4111-8111-111111111111
            ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            title: Architecture Notes
            status: published
    expect:
      error: DOCUMENT_CONFLICT
      state:
        Document:
          - id: 11111111-1111-4111-8111-111111111111
            ownerId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
            title: Architecture Notes
            status: published
